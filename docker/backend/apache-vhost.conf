<VirtualHost *:80>
    DocumentRoot /var/www/html

    # index.html hardcodes <script src="/dist/build.js">. Alias root-absolute
    # /dist so the built bundle resolves without touching project files.
    Alias /dist /var/www/html/repuestos/dist

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/repuestos>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html index.php
    </Directory>

    <Directory /var/www/html/repuestos/backend/web>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
